# 版本按 0.13.10 实测环境钉定 (source /home/tsc/tsc_profile 后 micromamba list)。
# 只钉版本、不钉 build string: 钉死 build 会让另一架构无法求解; 具体 build 由 conda
# 按目标架构与 python 版本选择。唯一的版本区间例外见 charset-normalizer 行注释。
name: tsc_python
channels:
  - conda-forge
dependencies:
  - _openmp_mutex=4.5
  - backports.zstd=1.8.0
  - bcrypt=5.0.0
  - brotli-python=1.2.0
  - bzip2=1.0.8
  - ca-certificates=2026.7.22
  - certifi=2026.7.22
  - cffi=2.1.1
  - charset-normalizer>=3.5.0,<3.5.3  # 3.5.2/3.5.3 无 aarch64 构建: x86_64 解 3.5.2, aarch64 解 3.5.1
  - cryptography=50.0.2
  - cx_oracle=8.3.0
  - cyrus-sasl=2.1.28
  - decorator=5.3.1
  - h2=4.4.1
  - hpack=4.2.0
  - hyperframe=6.1.0
  - icu=78.3
  - idna=3.20
  - invoke=3.0.3
  - keyutils=1.6.3
  - krb5=1.22.2
  # - ld_impl_linux-64
  - libedit=3.1.20260512
  - libexpat=2.8.5
  - libffi=3.7.0
  - libgcc=16.2.0
  - libgomp=16.2.0
  - liblzma=5.8.3
  - libnsl=2.0.1
  - libntlm=1.8
  - libpq=18.6
  - libsodium=1.0.22
  - libsqlite=3.54.0
  - libstdcxx=16.2.0
  - libuuid=2.42.4
  - libxcrypt=4.4.38
  - libzlib=1.3.2
  - ncurses=6.6
  - openldap=2.6.13
  - openssl=3.6.5
  - packaging=26.3
  - paramiko=5.0.0
  - pip=26.2.1
  - psycopg2=2.9.13
  - pycparser=3.11
  - pymysql=1.2.3
  - pynacl=1.6.2
  - pyopenssl=26.4.0
  - pysocks=1.7.1
  - python=3.13.16
  - python-gssapi=1.12.0
