# 定义本工具包的支持条件 (单一事实源)
#
# 支持条件只有两条: 架构在白名单内 + glibc 不低于基线; 发行版不设门禁
# (见 README "运行要求")。本文件被 build.sh 内联进 RPM %pre 脚本
# (彼时包内文件尚未落盘, 必须自包含); build.sh 同时在构建期断言
# 本文件的白名单与其自身的架构下载映射一致。
#
# 新增架构 checklist (构建期断言会拦下 1/2 的遗漏):
#   1. build.sh 的 arch_download_tags() 补 case (micromamba/jq 下载标识)
#   2. build.sh 补 micromamba_sha256_<arch> 与 jq_sha256_<arch> 常量
#   3. 本文件白名单加一项

# 支持的CPU架构 (逗号分隔)
# 例如: x86_64,aarch64
# 本包按架构分别出包 (环境内含本地编译的二进制), 架构由 nfpm.yaml 的 arch 声明,
# %pre 额外校验本机架构既在白名单内、也与所装包的架构一致
SUPPORTED_ARCHITECTURES="x86_64,aarch64"

# glibc 基线: 环境在 CentOS 7.9 (glibc 2.17) 容器中构建,
# 目标机 glibc 低于该值时环境无法运行, %pre 直接中止安装
GLIBC_BASELINE="2.17"
