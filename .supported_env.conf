# 定义本工具包支持的运行环境
#
# 本文件是 RPM %pre 准入校验的单一事实源: build.sh 会把它内联进 %pre 脚本
# (彼时包内文件尚未落盘, 必须自包含)。

# 支持的CPU架构 (逗号分隔)
# 例如: x86_64,aarch64
# 本包按架构分别出包 (环境内含本地编译的二进制), 架构由 nfpm.yaml 的 arch 声明,
# %pre 额外校验本机架构既在白名单内、也与所装包的架构一致
SUPPORTED_ARCHITECTURES="x86_64,aarch64"

# glibc 基线: 环境在 CentOS 7.9 (glibc 2.17) 容器中构建,
# 目标机 glibc 低于该值时环境无法运行, %pre 直接中止安装
GLIBC_BASELINE="2.17"
